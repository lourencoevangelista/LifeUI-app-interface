name: ci

on:
  push:
  pull_request:

jobs:
  ontology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r tools/requirements.txt
      # data-private/ is not in the repo, so only the ontology, shapes and synthetic fixtures are checked.
      - run: python tools/validate_ontology.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p lifeui-api
      - run: cargo check -p web --target wasm32-unknown-unknown

  # Vercel's Rust runtime builds with this exact compiler: fail here, not on deploy.
  rust-vercel-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --bins --release
      - run: cargo test --lib

  db:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx tsc --noEmit
      # Fails if schema.ts changed without a committed migration (generate would create new files).
      - run: |
          npx drizzle-kit generate --name ci_check
          test -z "$(git status --porcelain -- migrations)" || { git status --porcelain -- migrations; echo "schema changed without a migration"; exit 1; }
